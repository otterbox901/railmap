[project]
name = "railmap"
version = "0.1.0"
description = "GPU-NIC-CPU placement and RDMA connection-budget planner for multi-GPU nodes"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "typer>=0.12",
    "rich>=13",
    "nvidia-ml-py>=12",
    "scipy>=1.13",
]

[project.scripts]
railmap = "railmap.cli:app"

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["railmap"]

[tool.ruff]
line-length = 120

[tool.pytest.ini_options]
testpaths = ["tests"]
