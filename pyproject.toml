[project]
name = "railmap"
version = "0.1.0"
description = "GPU-NIC-CPU placement and RDMA connection-budget planner for multi-GPU nodes"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "railmap/topology/vendor/LICENSE"]
authors = [{ name = "Alexander Pershukevich" }]
requires-python = ">=3.10"
keywords = ["gpu", "rdma", "infiniband", "roce", "nccl", "nvshmem", "numa", "hpc", "topology"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Science/Research",
    "Intended Audience :: System Administrators",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: System :: Clustering",
    "Topic :: System :: Distributed Computing",
    "Topic :: System :: Hardware",
]
dependencies = [
    "typer>=0.13",
    "rich>=13",
    "nvidia-ml-py>=12",
    "numpy>=1.23",
    "scipy>=1.13",
]

[project.urls]
Homepage = "https://github.com/otterbox901/railmap"
Documentation = "https://github.com/otterbox901/railmap/tree/master/docs"
Issues = "https://github.com/otterbox901/railmap/issues"

[project.scripts]
railmap = "railmap.cli:app"

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["railmap"]

[tool.hatch.build.targets.sdist]
include = ["railmap", "tests", "docs/*.md", "examples", "LICENSE", "README.md"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.pytest.ini_options]
testpaths = ["tests"]
